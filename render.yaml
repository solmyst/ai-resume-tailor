services:
  # 🧠 Backend API Service (Node.js environment with Python backend)
  - type: web
    name: ai-resume-tailor
    env: node
    buildCommand: npm install && npm run render-build
    startCommand: npm run start
    envVars:
      - key: PORT
        value: 5000
      - key: FLASK_ENV
        value: production
      - key: FLASK_DEBUG
        value: "false"
      - key: PYTHON_VERSION
        value: "3.11.0"
