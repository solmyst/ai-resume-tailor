services:
  # 🧠 Python Backend Web Service
  - type: web
    name: ai-resume-tailor-backend
    env: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: gunicorn --chdir backend --bind 0.0.0.0:$PORT app:app
    envVars:
      - key: PORT
        value: 10000
      - key: FLASK_ENV
        value: production
      - key: FLASK_DEBUG
        value: "false"

  # 💻 React Static Frontend
  - type: web
    name: ai-resume-tailor-frontend
    env: static
    buildCommand: npm install && npm run build
    publishPath: dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: ai-resume-tailor-backend
          property: host
